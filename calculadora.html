<!DOCTYPE html>
<html>
<head>
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora</h1>

    <input type="number" id="numero1" placeholder="Primer número">
    <input type="number" id="numero2" placeholder="Segundo número">

    <br><br>

    <button onclick="sumar()">Sumar</button>
    <button onclick="restar()">Restar</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>
    <button onclick="potencia()">Potencia</button>
    <button onclick="porcentaje()">Porcentaje</button>
    <button onclick="raiz()">Raíz cuadrada</button>

    <h2 id="resultado">Resultado: </h2>

    <script>
        function obtenerNumeros() {
            let numero1 = parseFloat(document.getElementById("numero1").value);
            let numero2 = parseFloat(document.getElementById("numero2").value);
            return [numero1, numero2];
        }

        function sumar() {
            let numeros = obtenerNumeros();
            document.getElementById("resultado").innerText =
                "Resultado: " + (numeros[0] + numeros[1]);
        }

        function restar() {
            let numeros = obtenerNumeros();
            document.getElementById("resultado").innerText =
                "Resultado: " + (numeros[0] - numeros[1]);
        }

        function multiplicar() {
            let numeros = obtenerNumeros();
            document.getElementById("resultado").innerText =
                "Resultado: " + (numeros[0] * numeros[1]);
        }

        function dividir() {
            let numeros = obtenerNumeros();

            if (numeros[1] !== 0) {
                document.getElementById("resultado").innerText =
                    "Resultado: " + (numeros[0] / numeros[1]);
            } else {
                document.getElementById("resultado").innerText =
                    "No se puede dividir por cero";
            }
        }
function potencia() {
    let numeros = obtenerNumeros();
    let resultado = Math.pow(numeros[0], numeros[1]);
    document.getElementById("resultado").innerText =
        "Resultado: " + resultado;
}

function porcentaje() {
    let numeros = obtenerNumeros();
    let resultado = (numeros[0] * numeros[1]) / 100;
    document.getElementById("resultado").innerText =
        "Resultado: " + resultado;
}

function raiz() {
    let numeros = obtenerNumeros();

    if (numeros[0] >= 0) {
        let resultado = Math.sqrt(numeros[0]);
        document.getElementById("resultado").innerText =
            "Resultado: " + resultado;
    } else {
        document.getElementById("resultado").innerText =
            "No se puede calcular la raíz de un número negativo";
    }
}
    </script>
</body>
</html>
